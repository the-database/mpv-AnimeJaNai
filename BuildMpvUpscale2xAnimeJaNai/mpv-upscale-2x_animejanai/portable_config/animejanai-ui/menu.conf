# Right-click menu of the mpv-animejanai player (mpv menu.conf format: title, command and
# optional checked=/disabled=/hidden= conditions, separated by tabs; a tab-indented line is in the
# submenu above it). Loaded by the launcher through select.lua's menu_conf_path; plain mpv shows
# mpv's own menu. A command shows its key when it is identical to a binding's command in
# input-animejanai.conf, so keep the two in step. Managed file: replaced on every update.

Open
	Open Files...	script-message-to animejanai_ui open-files
	Open URL or file from clipboard	script-message-to animejanai_ui open-clipboard
	Open DVD/Blu-ray Drive/Folder...	script-message-to animejanai_ui open-disc

	Load external audio files...	script-message-to animejanai_ui load-audio
	Load external subtitle files...	script-message-to animejanai_ui load-sub

	Add files to playlist...	script-message-to animejanai_ui add-files

	Recent	script-binding select/select-watch-history

Play/Pause	cycle pause
Stop	stop

Toggle Fullscreen	cycle fullscreen	checked=fullscreen
Navigate
	Previous File	playlist-prev
	Next File	playlist-next

	First File	set playlist-pos 0
	Last File	set playlist-pos-1 ${playlist-count}

	Next Chapter	add chapter  1
	Previous Chapter	add chapter -1

	Jump Next Frame	frame-step
	Jump Previous Frame	frame-back-step

	Jump 5 sec forward	seek  5 exact
	Jump 5 sec backward	seek -5 exact

	Jump 30 sec forward	seek -85 exact
	Jump 30 sec backward	seek 85 exact

	Jump 5 min forward	seek  300 exact
	Jump 5 min backward	seek -300 exact

	Titles	$editions
	Chapters	$chapters
Pan && Scan
	Increase Size	add video-zoom  0.1
	Decrease Size	add video-zoom -0.1

	Move Left	add video-pan-x -0.01
	Move Right	add video-pan-x  0.01

	Move Up	add video-pan-y -0.01
	Move Down	add video-pan-y  0.01

	Decrease Height	add panscan -0.1
	Increase Height	add panscan  0.1

	Reset	set video-zoom 0; set video-pan-x 0; set video-pan-y 0
Video
	Take Screenshot (Source)	async screenshot
	Take Screenshot (Screen)	screenshot window
	Toggle Deinterlace	cycle deinterlace	checked=deinterlace == "yes"
	Cycle Aspect Ratio	cycle-values video-aspect 16:9 4:3 2.35:1 -1
	Rotate Video	cycle-values video-rotate 90 180 270 0
Audio
	Cycle/Next	cycle audio

	Delay +0.1	add audio-delay  0.1
	Delay -0.1	add audio-delay -0.1
Subtitle
	Cycle/Next	cycle sub

	Delay -0.1	add sub-delay -0.1
	Delay +0.1	add sub-delay  0.1

	Move Up	add sub-pos -1
	Move Down	add sub-pos +1

	Decrease Subtitle Font Size	add sub-scale -0.1
	Increase Subtitle Font Size	add sub-scale  0.1
Track	$tracks
Volume
	Up	add volume  2
	Down	add volume -2

	Mute	cycle mute	checked=mute
Speed
	-10%	multiply speed 1/1.1
	+10%	multiply speed 1.1

	Half	multiply speed 0.5
	Double	multiply speed 2.0

	Reset	set speed 1
View
	Zoom
		Enlarge	multiply current-window-scale 1.2
		Shrink	multiply current-window-scale 0.8

		50 %	set current-window-scale 0.5
		100 %	set current-window-scale 1.0
		200 %	set current-window-scale 2.0
		300 %	set current-window-scale 3.0
	Show Playlist	script-binding select/select-playlist
	Show Profile Selection	script-message-to animejanai_ui select-profile
	Show Profiles	script-message-to animejanai_ui select-profile
	Show Audio Tracks	script-binding select/select-aid
	Show Subtitle Tracks	script-binding select/select-sid
	Show Chapters	script-binding select/select-chapter
	Toggle Border	cycle border	checked=border
	Toggle On Top	cycle ontop	checked=ontop
	Toggle Statistics	script-binding stats/display-stats-toggle
	Toggle OSC Visibility	script-binding osc/visibility
	Show File/Stream Info	script-binding stats/display-stats-toggle
	Show Progress	show-progress
	Show Tracks	script-binding stats/display-stats-toggle
	Show Media Info	script-binding stats/display-stats-toggle
	Show Recent	script-binding select/select-watch-history
	Advanced
		Show Console	script-binding console/enable
		Show Audio Devices	script-binding select/select-audio-device
		Show Properties	script-binding select/show-properties
		Show Keys	script-binding select/select-binding
Profile	$profiles
Settings
	Show Config Editor	script-message animejanai-manager settings
	Open Config Folder	script-message-to animejanai_ui open-config-folder
	Setup
		Register video file associations	script-message-to animejanai_ui register video
		Register audio file associations	script-message-to animejanai_ui register audio
		Register image file associations	script-message-to animejanai_ui register image
		Unregister file associations	script-message-to animejanai_ui register unreg
Tools
	Show History	script-binding select/select-watch-history
	Set/clear A-B loop points	ab-loop
	Toggle infinite file looping	cycle-values loop-file inf no	checked=loop_file == "inf"
	Shuffle Playlist	playlist-shuffle
	Toggle Hardware Decoding	cycle-values hwdec auto no	checked=p["hwdec-current"] ~= nil and p["hwdec-current"] ~= "no"
	Exit Watch Later	quit-watch-later
AnimeJaNai
	Launch AnimeJaNai Manager	nonrepeatable script-message animejanai-manager
	Toggle AnimeJaNai Stats	script-binding "show_animejanai_stats"
	Install Update	script-message animejanai-update	hidden=not p["user-data/animejanai/update-available"]
Help
	Website mpv-AnimeJaNai	script-message-to animejanai_ui open-url https://github.com/the-database/mpv-AnimeJaNai
	Website mpv	script-message-to animejanai_ui open-url https://mpv.io
	Manual mpv	script-message-to animejanai_ui open-url https://mpv.io/manual/stable/
Command Palette	script-binding select/select-binding

Exit	quit
